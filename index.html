<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동네 한 끼</title>

<style>
:root {
  --primary: #245b45;
  --secondary: #eaf2ed;
  --background: #ffffff;
  --text: #202923;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: Arial, "Noto Sans KR", sans-serif;
}

.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 0 24px;
}

.top {
  height: 76px;
  border-bottom: 1px solid #e8ece9;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-weight: 850;
  font-size: 23px;
  color: var(--primary);
}

.brand small {
  display: block;
  font-size: 10px;
  color: #84938a;
}

.location {
  border: 1px solid #e2e8e3;
  border-radius: 30px;
  padding: 10px 14px;
  background: white;
  cursor: pointer;
}

.hero { padding: 38px 0 25px; }

.eyebrow {
  font-size: 12px;
  color: #64816f;
  font-weight: 750;
}

.hero h1 {
  font-size: 32px;
  margin: 9px 0;
}

.hero p {
  color: #7b877f;
  font-size: 14px;
}

.search {
  margin-top: 22px;
  display: flex;
  gap: 9px;
}

.search input {
  flex: 1;
  min-width: 0;
  border: 1px solid #e4e9e5;
  border-radius: 13px;
  padding: 14px;
  font-size: 14px;
}

.btn {
  border: 0;
  border-radius: 12px;
  padding: 12px 17px;
  background: var(--primary);
  color: white;
  font-weight: 700;
  cursor: pointer;
}

.btn:disabled {
  opacity: .6;
  cursor: wait;
}

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 5px 0 20px;
}

.chip {
  white-space: nowrap;
  border: 1px solid #e5eae6;
  background: white;
  border-radius: 30px;
  padding: 8px 14px;
  cursor: pointer;
  font-size: 13px;
}

.chip.active {
  background: var(--secondary);
  color: #244b39;
  font-weight: 750;
}

.sectionhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 12px 0 15px;
}

.sectionhead h2 { font-size: 19px; }

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}

.card {
  border: 1px solid #e9edea;
  border-radius: 18px;
  overflow: hidden;
  background: white;
}

.food {
  height: 135px;
  display: grid;
  place-items: center;
  font-size: 62px;
  background: #f2e9df;
}

.cardbody { padding: 15px; }

.meta {
  font-size: 11px;
  color: #8a968e;
}

.card h3 {
  font-size: 16px;
  margin: 7px 0 5px;
}

.desc {
  font-size: 12px;
  color: #758078;
  line-height: 1.5;
  min-height: 36px;
}

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  font-size: 12px;
}

.price {
  font-weight: 750;
  color: #34483b;
}

.like {
  border: 0;
  background: transparent;
  cursor: pointer;
  color: #728078;
}

.empty {
  padding: 35px;
  text-align: center;
  color: #8b968e;
  grid-column: 1/-1;
}

.footer {
  padding: 30px 0 45px;
  color: #9aa49d;
  font-size: 11px;
  text-align: center;
}

.modalback {
  position: fixed;
  inset: 0;
  background: #1119;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 5;
}

.modal {
  width: min(500px, 100%);
  background: white;
  border-radius: 20px;
  padding: 23px;
  max-height: 90vh;
  overflow-y: auto;
}

.field {
  display: grid;
  gap: 6px;
  margin: 12px 0;
}

.field label {
  font-size: 12px;
  color: #738078;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  border: 1px solid #e1e8e2;
  border-radius: 10px;
  padding: 12px;
  font: inherit;
}

.field textarea {
  min-height: 85px;
  resize: vertical;
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.secondary {
  background: #eef2ef;
  color: #3b5143;
}

.close {
  float: right;
  border: 0;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
}

.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: #263a2e;
  color: white;
  padding: 11px 16px;
  border-radius: 30px;
  font-size: 13px;
  display: none;
  z-index: 8;
}

@media(max-width:760px) {
  .wrap { padding: 0 17px; }
  .grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .food { height: 110px; font-size: 52px; }
}

@media(max-width:440px) {
  .grid { grid-template-columns: 1fr; }
  .food { height: 130px; }
}
</style>
</head>

<body>

<div id="app">

<header class="top wrap">
  <div class="brand">
    동네 한 끼
    <small>YOUR NEIGHBORHOOD FOOD PICK</small>
  </div>
  <button class="location" id="region">📍 서울 마포구 ▾</button>
</header>

<main class="wrap">

<section class="hero">
  <div class="eyebrow">오늘 저녁, 뭐 먹지?</div>
  <h1>우리 동네 사람들의<br>진짜 한 끼 추천</h1>
  <p>광고보다 솔직한 이웃들의 메뉴 추천을 만나보세요.</p>

  <div class="search">
    <input id="search" placeholder="메뉴, 동네, 음식점 검색">
    <button class="btn" id="searchBtn">검색</button>
  </div>
</section>

<nav class="filters" id="filters"></nav>

<div class="sectionhead">
  <h2>동네 추천 피드</h2>
  <select id="sort" class="chip">
    <option value="popular">인기순</option>
    <option value="latest">최신순</option>
  </select>
</div>

<section class="grid" id="feed"></section>

<div class="footer">동네 한 끼 · 우리 동네의 맛있는 발견</div>

</main>

<div style="position:fixed;right:24px;bottom:24px">
  <button class="btn" id="write">＋ 추천 작성하기</button>
</div>

</div>

<div class="modalback" id="back">
  <div class="modal">
    <button class="close" id="close">×</button>
    <h2>오늘의 한 끼 추천</h2>

    <form id="postForm">

      <div class="field">
        <label>메뉴 이름</label>
        <input name="title" required placeholder="예: 얼큰 순두부찌개">
      </div>

      <div class="field">
        <label>가격 (원)</label>
        <input name="price" type="number" min="0" placeholder="9000">
      </div>

      <div class="field">
        <label>음식 종류</label>
        <select name="category">
          <option>한식</option>
          <option>중식</option>
          <option>일식</option>
          <option>양식</option>
          <option>분식</option>
          <option>기타</option>
        </select>
      </div>

      <div class="field">
        <label>동네</label>
        <input name="area" required placeholder="예: 합정동">
      </div>

      <div class="field">
        <label>추천 이유</label>
        <textarea name="desc" required placeholder="왜 추천하는지 알려주세요"></textarea>
      </div>

      <div class="field">
        <label>작성자 닉네임</label>
        <input name="author" placeholder="동네주민">
      </div>

      <div class="actions">
        <button type="button" class="btn secondary" id="cancel">취소</button>
        <button type="submit" class="btn" id="submitBtn">등록하기</button>
      </div>

    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ======================================
// 1. SUPABASE 설정
// ======================================

const SUPABASE_URL =
  'https://jrulyzxanulvqzbqoisv.supabase.co';

// Supabase Settings → API Keys에서 복사한
// Publishable key를 아래 문자열 안에 붙여 넣으세요.
const SUPABASE_KEY =
  '여기에_새로_복사한_Publishable_Key를_붙여넣으세요';

const POSTS_API =
  `${SUPABASE_URL}/rest/v1/posts`;

const apiHeaders = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};


// ======================================
// 2. 기본 상태
// ======================================

const categories = [
  '전체', '한식', '중식', '일식',
  '양식', '분식', '카페', '기타'
];

let active = '전체';
let posts = [];
let liked = new Set();

const $ = selector => document.querySelector(selector);


// ======================================
// 3. 화면 기능
// ======================================

function toast(message) {
  $('#toast').textContent = message;
  $('#toast').style.display = 'block';

  setTimeout(() => {
    $('#toast').style.display = 'none';
  }, 2500);
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function renderFilters() {
  $('#filters').innerHTML = categories.map(category => `
    <button
      class="chip ${category === active ? 'active' : ''}"
      data-cat="${category}">
      ${category}
    </button>
  `).join('');
}

function render() {
  const query = $('#search').value.toLowerCase();

  let list = posts.filter(post =>
    (active === '전체' || post.category === active) &&
    [
      post.title,
      post.area,
      post.desc
    ].join(' ').toLowerCase().includes(query)
  );

  if ($('#sort').value === 'popular') {
    list.sort((a, b) => b.likes - a.likes);
  } else {
    list.sort((a, b) =>
      new Date(b.created_at || 0) -
      new Date(a.created_at || 0)
    );
  }

  $('#feed').innerHTML = list.length
    ? list.map(post => `
      <article class="card">
        <div class="food">${esc(post.emoji || '🍽️')}</div>

        <div class="cardbody">
          <div class="meta">
            ${esc(post.area)} · ${esc(post.category)}
          </div>

          <h3>${esc(post.title)}</h3>

          <div class="desc">
            ${esc(post.desc)}
          </div>

          <div class="bottom">
            <span class="price">
              ${Number(post.price).toLocaleString()}원
            </span>

            <button
              class="like"
              data-like="${esc(post.id)}">
              ♥ ${post.likes || 0}
            </button>
          </div>
        </div>
      </article>
    `).join('')
    : '<div class="empty">검색 결과가 없어요.</div>';
}


// ======================================
// 4. Supabase 데이터 변환
// ======================================

function fromDatabase(row) {
  return {
    id: row.id,
    title: row.title,
    price: Number(row.price) || 0,
    category: row.category || '기타',
    area: row.area || row.region || '동네 미지정',
    emoji: row.emoji || '🍽️',
    desc: row.description || '',
    author: row.author || '동네주민',
    likes: 0,
    created_at: row.created_at
  };
}


// ======================================
// 5. 게시글 불러오기
// ======================================

async function loadSharedPosts() {

  if (
    !SUPABASE_KEY ||
    SUPABASE_KEY.includes('여기에_')
  ) {
    toast('Supabase Publishable Key를 입력해 주세요.');
    return;
  }

  try {
    const response = await fetch(
      `${POSTS_API}?select=*&order=created_at.desc`,
      { headers: apiHeaders }
    );

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(
        `조회 오류 ${response.status}: ${errorText}`
      );
    }

    const rows = await response.json();

    posts = rows.map(fromDatabase);

    renderFilters();
    render();

    toast(`공유 게시글 ${rows.length}개를 불러왔어요.`);

  } catch (error) {
    console.error(error);
    toast('게시글을 불러오지 못했어요. Supabase 설정을 확인해 주세요.');
  }
}


// ======================================
// 6. 게시글 등록
// ======================================

$('#postForm').addEventListener('submit', async event => {

  event.preventDefault();

  if (
    !SUPABASE_KEY ||
    SUPABASE_KEY.includes('여기에_')
  ) {
    toast('Supabase Publishable Key를 먼저 입력해 주세요.');
    return;
  }

  const form = event.currentTarget;
  const data = new FormData(form);

  const category = String(data.get('category') || '기타');

  const emojiMap = {
    한식: '🍲',
    중식: '🥡',
    일식: '🍣',
    양식: '🍝',
    분식: '🍢',
    카페: '☕'
  };

  const payload = {
    title: String(data.get('title') || '').trim(),
    price: Number(data.get('price')) || 0,
    category: category,
    area: String(data.get('area') || '').trim(),
    region: '서울 마포구',
    emoji: emojiMap[category] || '🍽️',
    bg: '#f2e9df',
    description: String(data.get('desc') || '').trim(),
    author: String(data.get('author') || '').trim() || '동네주민'
  };

  if (
    !payload.title ||
    !payload.area ||
    !payload.description
  ) {
    toast('필수 항목을 입력해 주세요.');
    return;
  }

  const button = $('#submitBtn');

  button.disabled = true;
  button.textContent = '등록 중…';

  try {

    const response = await fetch(POSTS_API, {
      method: 'POST',
      headers: {
        ...apiHeaders,
        Prefer: 'return=representation'
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const errorText = await response.text();

      throw new Error(
        `등록 실패 (${response.status}): ${errorText}`
      );
    }

    const result = await response.json();

    if (!result.length) {
      throw new Error('저장 결과를 확인하지 못했어요.');
    }

    posts.unshift(fromDatabase(result[0]));

    active = '전체';

    renderFilters();
    render();

    form.reset();
    modal(false);

    toast('게시글이 등록됐어요!');

  } catch (error) {

    console.error('Supabase insert error:', error);

    toast(error.message.slice(0, 180));

  } finally {

    button.disabled = false;
    button.textContent = '등록하기';

  }

});


// ======================================
// 7. 버튼 및 이벤트
// ======================================

function modal(show) {
  $('#back').style.display = show ? 'flex' : 'none';
}

$('#write').onclick = () => modal(true);

$('#close').onclick = () => modal(false);
$('#cancel').onclick = () => modal(false);

$('#back').onclick = event => {
  if (event.target === $('#back')) {
    modal(false);
  }
};

$('#filters').addEventListener('click', event => {
  const button = event.target.closest('[data-cat]');

  if (button) {
    active = button.dataset.cat;
    renderFilters();
    render();
  }
});

$('#searchBtn').onclick = render;
$('#search').oninput = render;
$('#sort').onchange = render;

$('#feed').addEventListener('click', event => {
  const button = event.target.closest('[data-like]');

  if (!button) return;

  const id = button.dataset.like;

  toast('좋아요 기능은 다음 단계에서 데이터베이스와 연결할게요.');
});

$('#region').onclick = () => {
  toast('지역 선택 기능은 다음 단계에서 추가할게요.');
};


// ======================================
// 8. 최초 실행
// ======================================

renderFilters();
loadSharedPosts();

</script>

</body>
</html>
